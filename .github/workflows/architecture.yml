name: Architecture

on:
  push:
    branches:
      - main
    paths:
      - "architecture/**"
      - ".github/workflows/architecture.yml"
  pull_request:
    paths:
      - "architecture/**"
      - ".github/workflows/architecture.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install architecture validation dependency
        run: python -m pip install --disable-pip-version-check -r architecture/tests/requirements.txt

      - name: Validate architecture change
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
            fi
          fi
          python architecture/tests/check.py --base "$base" --head "$GITHUB_SHA"
          git diff --check "$base" "$GITHUB_SHA" -- architecture .github/workflows/architecture.yml
