name: Simulation contracts

on:
  push:
    branches: [main]
    paths:
      - "simulations/**"
      - ".github/workflows/simulations.yml"
  pull_request:
    branches: [main]
    paths:
      - "simulations/**"
      - ".github/workflows/simulations.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r simulations/tests/requirements.txt
      - run: python simulations/tests/validate.py
      - run: python -m unittest -v simulations.tests.test_runner
      - run: python -m unittest -v simulations.tests.test_robotics_production
      - run: git diff --check
