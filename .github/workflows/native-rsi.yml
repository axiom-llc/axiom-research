name: native-rsi

on:
  push:
    branches: [main]
    paths:
      - 'rsi/**'
      - 'research_queue_check.py'
      - '.github/workflows/native-rsi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rsi/**'
      - 'research_queue_check.py'
      - '.github/workflows/native-rsi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate canonical queue
        run: python research_queue_check.py research-queue.json
      - name: Test native generation and rollback
        run: python -m unittest rsi.test_native -v
      - name: Generate authenticated source-derived candidate
        run: python -m rsi.native --output "$RUNNER_TEMP/candidates.json"
      - name: Measure fixed synthetic before and after workload
        run: python -m rsi.benchmark --output "$RUNNER_TEMP/benchmark.json"
      - name: Retain bounded native RSI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-rsi-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/candidates.json
            ${{ runner.temp }}/benchmark.json
          retention-days: 14
          if-no-files-found: warn
